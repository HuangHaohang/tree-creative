[project]
name = "tree-creative-api"
version = "0.1.0"
description = "Tree Creative FastAPI service"
requires-python = ">=3.13.3"
dependencies = [
    "alembic==1.20.0",
    "asgi-correlation-id==5.0.1",
    "asyncmy==0.2.14",
    "authlib==1.8.0",
    "celery[redis]==5.6.3",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-redis==0.5.2",
    "minio==7.2.20",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.14.0",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.54",
    "structlog==26.1.0",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
tree-creative-api = "tree_creative_api.main:run"

[project.optional-dependencies]
browser = [
    "playwright==1.63.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=tree_creative_api --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tree_creative_api"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["tree_creative_api"]

[[tool.mypy.overrides]]
module = ["celery.*", "minio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tree_creative_api.tasks.*"]
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]
