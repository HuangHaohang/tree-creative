name: Feature request
description: Propose a product or engineering improvement with measurable value.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or business problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the expected behavior and measurable success criteria.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Users and scenarios
      description: Who needs this, and in which workflows?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Note security, data, compatibility, performance, compliance, or deadline constraints.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
